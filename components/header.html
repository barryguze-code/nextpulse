<header class="np-header">
  <div class="np-header-left">
    <button class="np-icon-button d-lg-none" type="button" data-sidebar-toggle aria-label="Open navigation">
      <i class="bi bi-list"></i>
    </button>
    <label class="np-global-search" aria-label="Search">
      <i class="bi bi-search"></i>
      <input type="search" placeholder="Search">
    </label>
    <div class="np-header-title">
      <p class="np-kicker mb-1">Workspace</p>
      <h2 id="pageTitle">Home</h2>
    </div>
  </div>

  <div class="np-header-actions">
    <label class="np-language-picker" title="Dil / Language">
      <i class="bi bi-globe2" aria-hidden="true"></i>
      <span class="visually-hidden">Dil</span>
      <select id="platformLanguage" aria-label="Dil">
        <option value="tr">🇹🇷 TR</option>
        <option value="en">🇺🇸 EN</option>
      </select>
    </label>
    <button class="np-icon-button np-notification-button" type="button" id="notificationButton" aria-label="Notifications" aria-expanded="false">
      <i class="bi bi-bell"></i>
      <span class="np-notification-badge" id="notificationBadge" hidden>0</span>
    </button>
    <aside class="np-notification-popover" id="notificationPopover" hidden>
      <div class="np-notification-head"><strong>Inventory alerts</strong><button type="button" id="notificationRefresh"><i class="bi bi-arrow-clockwise"></i></button></div>
      <div id="notificationList"><p>Loading alerts…</p></div>
    </aside>
    <button class="np-user-button" type="button" aria-label="User menu">
      <span class="np-user-avatar" id="userAvatar">U</span>
      <span class="np-user-meta d-none d-sm-grid">
        <strong id="userDisplayName">User</strong>
        <small id="userRole">Role</small>
      </span>
    </button>
    <button class="np-icon-button" type="button" id="logoutButton" aria-label="Sign out">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</header>
